site_name: The Algebra of Distributed Training
site_description: Mathematical Foundations of Large-Scale Machine Learning
site_author: Taras Tsugrii
site_url: https://ttsugriy.github.io/distributed-training-book/

repo_name: ttsugriy/distributed-training-book
repo_url: https://github.com/ttsugriy/distributed-training-book

copyright: Copyright &copy; 2025–2026 Taras Tsugrii

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_name: 分布式训练的代数
          site_description: 大规模机器学习的数学基础
          nav_translations:
            Home: 首页
            "Part I: Foundations": "第一部分：基础"
            "Part II: Scaling Laws": "第二部分：扩展定律"
            "Part III: The Algebra of Collectives": "第三部分：集合通信代数"
            "Part IV: Parallelism from Properties": "第四部分：从性质推导并行"
            "Part V: Memory as a Dimension": "第五部分：内存维度"
            "Part VI: Composition and Resilience": "第六部分：组合与容错"
            "Part VII: Efficiency Frontiers": "第七部分：效率前沿"
            "Part VIII: Synthesis": "第八部分：综合"
            Appendices: 附录
            Preface: 前言
            "The Scale Imperative": 规模的必然性
            "The Extended Roofline": 扩展屋顶线模型
            "The Memory Hierarchy of a Cluster": 集群的内存层次结构
            "Data Pipeline I/O": 数据流水线与 I/O
            "The α-β Model": α-β 模型
            "The Economics of Compute": 算力经济学
            "Estimation as Discipline": 估算即纪律
            "The Compute-Loss Surface": 计算-损失曲面
            "Chinchilla Optimality": Chinchilla 最优性
            "Phase Transitions in Scaling": 扩展中的相变
            "Batch Size and Learning Dynamics": 批大小与学习动力学
            "Collective Primitives and Properties": 集合通信原语与性质
            "Ring and Tree Algorithms": 环形与树形算法
            "The Collective Cost Model": 集合通信成本模型
            "Topology-Aware Collectives": 拓扑感知的集合通信
            "Data Parallelism from Associativity": 从结合律推导数据并行
            "Tensor Parallelism from Linearity": 从线性性推导张量并行
            "Pipeline Parallelism from Separability": 从可分离性推导流水线并行
            "Sequence Parallelism from Decomposability": 从可分解性推导序列并行
            "Expert Parallelism from Sparsity": 从稀疏性推导专家并行
            "The Memory Equation": 内存方程
            "ZeRO: Zero Redundancy Optimizer": "ZeRO：零冗余优化器"
            "Activation Recomputation": 激活重计算
            "Offloading: Extending Memory Beyond the GPU": "卸载：突破 GPU 内存限制"
            "The Device Mesh Abstraction": 设备网格抽象
            "3D Parallelism": 三维并行
            "4D and 5D Parallelism": 四维与五维并行
            "Failures and Checkpointing": 故障与检查点
            "Configuration Search": 配置搜索
            "Gradient Compression": 梯度压缩
            "Asynchrony and Local SGD": 异步与本地 SGD
            "Reduced Precision Training": 降精度训练
            "Overlapping Communication with Computation": 通信与计算重叠
            "Architecture-Aware Efficiency": 架构感知的效率
            "Profiling Distributed Training": 分布式训练性能剖析
            "Investigation Protocol": 排查协议
            "Case Study: LLaMA 3": "案例研究：LLaMA 3"
            "Case Study: DeepSeek-V3": "案例研究：DeepSeek-V3"
            "Case Study: Mistral and Mixtral": "案例研究：Mistral 与 Mixtral"
            "Conclusion: The Algebra of Scale": "结语：规模的代数"
            Glossary: 术语表
            "Notation and Minimal Formalism": 符号与最小形式化
            "Hardware Assumptions and Units": 硬件假设与单位
            "Quick Reference": 快速参考
            References: 参考文献

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/stepper.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/notation.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ttsugriy
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ArtOfParallel

